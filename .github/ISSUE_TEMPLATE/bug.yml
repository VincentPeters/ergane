name: Bug report
description: Something in Ergane is broken or cuts wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: input
    id: part
    attributes:
      label: Part and settings
      description: For example "Box 5 × 4 × 3, GRID8-M3, Acrylic 3 mm, kerf 0.20, normal fit".
  - type: textarea
    id: kit
    attributes:
      label: Kit file or share link
      description: Optional. Attach the kit JSON, or paste a share link (it contains the whole kit).
  - type: input
    id: browser
    attributes:
      label: Browser and system
      description: For example "Firefox 140 on Windows 11".
  - type: input
    id: laser
    attributes:
      label: Laser software
      description: If the problem is in an exported file, which program opened it (LightBurn, Inkscape, …).
